<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- GOOGLE LOGIN -->
        <div class="auth-bar">
    <div id="userInfo" class="user-info">

        <div class="profile-name">
            <span id="userName"></span>

            <button id="editNameBtn" class="edit-name-btn" title="Edit name">
                ✎
            </button>
        </div>

        <button id="logoutBtn" class="secondary-btn">
            Sign Out
        </button>

    </div>
</div>

<!-- Edit Name Modal -->
<div id="nameModal" class="name-modal hidden">

    <div class="name-modal-card">

        <h2>Edit Name</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name"
            maxlength="30"
        >

        <div class="name-modal-actions">
            <button id="cancelNameBtn" class="secondary-btn">
                Cancel
            </button>

            <button id="saveNameBtn" class="primary-btn">
                Save
            </button>
        </div>

    </div>

</div>


        <!-- HEADER -->

        <header>

            <h1>Attendance Tracker</h1>

            <p>
                Track your subject-wise attendance.
            </p>

        </header>


        <!-- TOP BAR -->

        <div class="top-bar">

            <div>

                <label for="threshold">
                    Attendance Threshold
                </label>

                <div class="threshold-input">

                    <input
                        type="number"
                        id="threshold"
                        value="85"
                        min="1"
                        max="100"
                    >

                    <span>%</span>

                </div>

            </div>


            <button
                id="addSubjectBtn"
                class="primary-btn"
            >
                + Add Subject
            </button>

        </div>


        <!-- SUBJECTS -->

        <div id="subjectsContainer"></div>


        <!-- EMPTY STATE -->

        <div
            id="emptyState"
            class="empty-state"
        >

            <h2>No subjects added</h2>

            <p>
                Add a subject to start tracking your attendance.
            </p>

        </div>

    </div>


    <!-- ADD SUBJECT MODAL -->

    <div
        id="modal"
        class="modal hidden"
    >

        <div class="modal-content">

            <h2>Add Subject</h2>


            <label for="subjectName">
                Subject Name
            </label>

            <input
                type="text"
                id="subjectName"
                placeholder="e.g. Data Structures"
            >


            <label for="attended">
                Classes Attended
            </label>

            <input
                type="number"
                id="attended"
                min="0"
                placeholder="e.g. 25"
            >


            <label for="conducted">
                Classes Conducted
            </label>

            <input
                type="number"
                id="conducted"
                min="0"
                placeholder="e.g. 30"
            >


            <div
                id="modalError"
                class="error"
            ></div>


            <div class="modal-buttons">

                <button
                    id="cancelBtn"
                    class="secondary-btn"
                >
                    Cancel
                </button>

                <button
                    id="saveSubjectBtn"
                    class="primary-btn"
                >
                    Add Subject
                </button>

            </div>

        </div>

    </div>


    <!-- FIREBASE / APP -->

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
